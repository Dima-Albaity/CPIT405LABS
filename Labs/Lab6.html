<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 - Like or Dislike</title>
    <link rel="stylesheet" href="Lab6.css">
</head>
<body>
    <div class="container">
        <h1>Lab 6</h1>
        <h2>Like or dislike</h2>

        <div class="vote-buttons">
            <button id="like-btn">👍 <span id="likes">0</span></button>
            <button id="dislike-btn">👎 <span id="dislikes">0</span></button>
        </div>

        <h2>Comments</h2>

        <textarea id="comment-input"
            placeholder="Write a comment..."></textarea>

        <div class="actions">
            <button id="submit-btn">Submit</button>
            <button id="clear-btn">Clear</button>
            <button id="reset-btn">Reset</button>
        </div>

        <p id="message"></p>
        <div id="comments-list"></div>
    </div>

    <script src="Lab6.js"></script>
</body>
</html>
